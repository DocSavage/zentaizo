[workspace]
name = "zentaizo"
version = "0.1.0"
description = "A hierarchical context workspace for AI assistants."
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = ">=3.11"

[pypi-dependencies]
zentaizo = { path = ".", editable = true, extras = ["dev"] }

[tasks]
test = "python -m unittest discover -s tests"
lint = "ruff check ."
fmt = "ruff format ."
check = { depends-on = ["lint", "test"] }
help = "python -m zentaizo --help"
clean = "rm -rf dist build src/zentaizo.egg-info"
build = { cmd = "python -m build", depends-on = ["clean"] }
publish = "twine upload --skip-existing dist/*"
hooks-install = "pre-commit install"
hooks-run = "pre-commit run --all-files"
