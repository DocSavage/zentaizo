[workspace]
name = "zentaizo"
version = "0.1.0"
description = "A hierarchical context workspace for AI assistants."
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = ">=3.11"
pip = "*"

[tasks]
install-cli = "python -m pip install -e ."
test = "python -m unittest discover -s tests"
help = "python -m zentaizo --help"
