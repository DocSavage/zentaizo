[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zentaizo"
version = "0.9.0"
description = "A hierarchical context workspace for AI assistants working across repos, docs, papers, and notes."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Zentaizo contributors" }
]
dependencies = []

[project.optional-dependencies]
docs-scan = [
  "llm-guard>=0.3.16",
]
graph = [
  "graphifyy>=0.8.39",
]
dev = [
  "ruff>=0.6",
  "pre-commit>=3.7",
  "build>=1.2",
  "twine>=5.1",
]

[project.scripts]
zentaizo = "zentaizo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zentaizo = [
  "templates/skills/*.md",
  "templates/global-skills/zentaizo/*.md",
  "templates/global-skills/zentaizo/agents/*.yaml",
  "templates/hooks/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
