[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zentaizo"
version = "0.1.0"
description = "A hierarchical context workspace for AI assistants working across repos, docs, papers, and notes."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Zentaizo contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
]

[project.scripts]
zentaizo = "zentaizo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zentaizo = ["templates/skills/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
