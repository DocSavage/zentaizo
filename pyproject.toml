[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zentaizo"
dynamic = ["version"]
description = "A hierarchical context workspace for AI assistants working across repos, docs, papers, and notes."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Zentaizo contributors" }
]
dependencies = []

[project.optional-dependencies]
docs-scan = [
  "llm-guard>=0.3.16",
]
graph = [
  "graphifyy>=0.8.39",
]
dev = [
  "ruff>=0.6",
  "pre-commit>=3.7",
  "build>=1.2",
  "twine>=5.1",
]

[project.scripts]
zentaizo = "zentaizo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zentaizo = [
  "templates/skills/*.md",
  "templates/global-skills/zentaizo/*.md",
  "templates/global-skills/zentaizo/agents/*.yaml",
  "templates/hooks/*",
]

[tool.setuptools.dynamic]
version = {attr = "zentaizo.__version__"}

[tool.uv]
# The version is dynamic (zentaizo.__version__ above), so the resolver must be
# told which files invalidate its cached metadata for this path package —
# otherwise a version bump is invisible to `pixi lock`/`pixi update` and the
# pixi.lock self-entry goes stale (uv's default cache keys track only the
# build manifests, not the module holding the version).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/zentaizo/__init__.py" }]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
